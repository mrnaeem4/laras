<div class="modal fade" id="pullModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Pull from Wazuh Manager</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label d-block mb-1">Environment</label>
                    <div class="btn-group" role="group" aria-label="Select environment to pull">
                        <input type="radio" class="btn-check" name="pullEnv" id="pullEnvDev" value="dev" checked autocomplete="off">
                        <label class="btn btn-outline-primary btn-sm" for="pullEnvDev">Dev</label>
                        <input type="radio" class="btn-check" name="pullEnv" id="pullEnvProd" value="prod" autocomplete="off">
                        <label class="btn btn-outline-primary btn-sm" for="pullEnvProd">Prod</label>
                    </div>
                </div>
                <p class="mb-2">Select the files to pull from the Wazuh Manager into the local database. Files with unpushed local edits are not overwritten; their status is marked <strong>conflict</strong> for manual resolution.</p>
                <div id="pullFileListLoading" class="text-muted small">Loading file list...</div>
                <div id="pullFileListError" class="text-danger small d-none"></div>
                <div id="pullFileListContainer" class="d-none" style="max-height: 45vh; overflow-y: auto;">
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="mb-0"><i class="fa-solid fa-file-lines me-1"></i>Rules</h6>
                            <label class="small mb-0"><input type="checkbox" id="pullRulesSelectAll" checked> Select all</label>
                        </div>
                        <div id="pullRulesFileList" class="sync-file-list"></div>
                    </div>
                    <div>
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="mb-0"><i class="fa-solid fa-puzzle-piece me-1"></i>Decoders</h6>
                            <label class="small mb-0"><input type="checkbox" id="pullDecodersSelectAll" checked> Select all</label>
                        </div>
                        <div id="pullDecodersFileList" class="sync-file-list"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary btn-sm" id="btnConfirmPull">Pull Selected Files</button>
            </div>
        </div>
    </div>
</div>
